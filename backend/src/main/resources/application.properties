# -------------------------------------------------------
# Direct connection to the Supabase PostgreSQL database
# -------------------------------------------------------
# sslmode=require is mandatory — Supabase rejects connections that don't use SSL
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.thsaqyoeffbvuoovdpmu

# -------------------------------------------------------
# Database password  KEEP THIS PRIVATE
# Find it: Supabase Dashboard  Settings  Database  Database Password
# -------------------------------------------------------
spring.datasource.password=PokemonDemo123!

# -------------------------------------------------------
# Run the backend on port 8080
# The frontend will call http://localhost:8080
# -------------------------------------------------------
server.port=8080

# -------------------------------------------------------
# Spring Security: where to fetch Supabase's public signing key
# Spring fetches this automatically on startup and uses it to verify every JWT
# -------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://thsaqyoeffbvuoovdpmu.supabase.co/auth/v1/.well-known/jwks.json

# -------------------------------------------------------
# JPA / Hibernate settings
# -------------------------------------------------------
# ddl-auto=none: Hibernate must never touch the schema — Supabase owns it
spring.jpa.hibernate.ddl-auto=none
# open-in-view=false: closes the DB session before the response is sent (best practice)
spring.jpa.open-in-view=false
