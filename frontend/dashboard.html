<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PokemonJagt — Dashboard</title>
    <link rel="stylesheet" href="css/main.css">

    <!-- Load order: konstanter → jwt-helpers → api-kald → side-logik -->
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/dashboard.js"></script>
</head>
<body>

<header>
    <strong>PokemonJagt</strong>
    <nav>
        <span id="headerRoleLabel"></span>
        <a href="#" onclick="logoutAndReturnToLogin()">Logout</a>
    </nav>
</header>

<main>

    <!-- ===================================================
         INGEN PROFIL — brugeren er ikke oprettet af gym leader endnu
         =================================================== -->
    <div id="noProfileSection" class="hidden">
        <p class="empty-team-message">Din konto er ikke sat op endnu. Kontakt gym leaderen.</p>
    </div>

    <!-- ===================================================
         GYM LEADER VIEW
         =================================================== -->
    <div id="gymLeaderSection" class="hidden">
        <h2>Gym Administration</h2>

        <!-- Opret ny bruger -->
        <div class="create-profile-form" style="margin-bottom: 2rem;">
            <h3 style="margin-top:0;">Opret ny bruger</h3>
            <label>Navn</label>
            <input id="newMemberName" type="text" placeholder="Navn" />
            <label>Email</label>
            <input id="newMemberEmail" type="email" placeholder="bruger@example.com" />
            <label>Password</label>
            <input id="newMemberPassword" type="password" placeholder="Min. 6 tegn" />
            <label>Telefonnummer</label>
            <input id="newMemberPhone" type="tel" placeholder="12345678" />
            <label>Adresse</label>
            <input id="newMemberAddress" type="text" placeholder="By, Gade" />
            <label>Rolle</label>
            <select id="newMemberRole">
                <option value="TRAINER">Trainer</option>
                <option value="FARMER">Farmer</option>
                <option value="BREEDER">Breeder</option>
                <option value="GYM_LEADER">Gym Leader</option>
            </select>
            <button class="primary-button" onclick="submitCreateMember()">Opret bruger</button>
            <p id="createMemberError" class="error-message"></p>
        </div>

        <!-- Alle brugere -->
        <h3>Alle brugere</h3>
        <div id="memberListGrid" class="pokemon-grid"></div>
    </div>

    <!-- ===================================================
         TRAINER VIEW
         =================================================== -->
    <div id="trainerSection" class="hidden">

        <h2>Mit hold</h2>
        <a href="pokedex.html" class="pokedex-link">+ Fang flere Pokémon i Pokédex</a>
        <div id="ownTeamGrid" class="pokemon-grid"></div>
        <p id="ownTeamEmpty" class="empty-team-message hidden">Dit hold er tomt.</p>

        <h2 style="margin-top: 2rem;">Alle trainers' hold</h2>
        <div id="allTeamsContainer"></div>
    </div>

    <!-- ===================================================
         FARMER VIEW
         =================================================== -->
    <div id="farmerSection" class="hidden">
        <h2>Gym Leaderens Hold</h2>
        <div id="leaderTeamGrid" class="pokemon-grid"></div>
        <p id="leaderTeamEmpty" class="empty-team-message hidden">Gym leaderens hold er tomt.</p>
    </div>

    <!-- ===================================================
         BREEDER VIEW
         =================================================== -->
    <div id="breederSection" class="hidden">
        <h2>Gymnasets Økonomi</h2>
        <div class="trainer-profile-card">
            <p>Totale penge: <strong id="gymMoneyDisplay"></strong> PokéCoins</p>
        </div>
    </div>

</main>

</body>
</html>
