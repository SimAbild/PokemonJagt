<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PokemonJagt — Login</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        h1 { text-align: center; color: #e63946; margin-bottom: 1.5rem; }
        h2 { margin-top: 0; }
        label { font-size: 0.9rem; font-weight: bold; }
        input {
            width: 100%;
            padding: 0.6rem;
            margin: 0.3rem 0 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .submit-button {
            width: 100%;
            padding: 0.7rem;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        .submit-button:hover { background: #c1121f; }
        .switch-form-link {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .switch-form-link a { color: #e63946; cursor: pointer; text-decoration: underline; }
        .error-message {
            color: #e63946;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none; /* Hidden until an error occurs */
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>PokemonJagt</h1>

    <!-- LOGIN FORM — shown by default -->
    <div id="loginFormSection">
        <h2>Login</h2>
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="ash@pokemon.com" />
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="password123" />
        <button class="submit-button" onclick="submitLoginForm()">Login</button>
        <p class="error-message" id="loginErrorMessage"></p>
        <p class="switch-form-link">
            No account yet? <a onclick="showRegisterForm()">Register here</a>
        </p>
    </div>

    <!-- REGISTER FORM — hidden until the user clicks "Register here" -->
    <div id="registerFormSection" class="hidden">
        <h2>Create Account</h2>
        <label>Email</label>
        <input id="registerEmail" type="email" placeholder="trainer@example.com" />
        <label>Password</label>
        <input id="registerPassword" type="password" placeholder="Min. 6 characters" />
        <button class="submit-button" onclick="submitRegisterForm()">Create Account</button>
        <p class="error-message" id="registerErrorMessage"></p>
        <p class="switch-form-link">
            Already have an account? <a onclick="showLoginForm()">Login here</a>
        </p>
    </div>
</div>

<script src="js/app.js"></script>
<script>

    // If the user already has a JWT, skip the login page entirely
    if (getJwtFromLocalStorage()) {
        window.location.href = 'dashboard.html';
    }

    function showLoginForm() {
        document.getElementById('loginFormSection').classList.remove('hidden');
        document.getElementById('registerFormSection').classList.add('hidden');
    }

    function showRegisterForm() {
        document.getElementById('loginFormSection').classList.add('hidden');
        document.getElementById('registerFormSection').classList.remove('hidden');
    }

    async function submitLoginForm() {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorDisplay = document.getElementById('loginErrorMessage');

        // Hide any previous error before trying again
        errorDisplay.style.display = 'none';

        const response = await callPublicApi('/api/auth/login', { email, password });

        if (!response.ok) {
            errorDisplay.textContent = 'Wrong email or password. Demo accounts: ash@pokemon.com / password123';
            errorDisplay.style.display = 'block';
            return;
        }

        const tokenData = await response.json();

        // Store the JWT — this is what unlocks all protected pages
        saveJwtToLocalStorage(tokenData.access_token);
        window.location.href = 'dashboard.html';
    }

    async function submitRegisterForm() {
        const email    = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value;
        const errorDisplay = document.getElementById('registerErrorMessage');

        errorDisplay.style.display = 'none';

        const response = await callPublicApi('/api/auth/register', { email, password });

        if (!response.ok) {
            errorDisplay.textContent = 'Registration failed. This email may already be in use.';
            errorDisplay.style.display = 'block';
            return;
        }

        // Registration does not return a JWT — the user must log in to get one
        alert('Account created! Please log in.');
        showLoginForm();
    }

</script>
</body>
</html>
